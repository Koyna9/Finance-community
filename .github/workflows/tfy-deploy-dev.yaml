name: Deploy to TrueFoundry

on:
  push:
    branches:
      - 'dev'

env:
  TFY_HOST: https://adoptai.truefoundry.cloud
  TFY_API_KEY: ${{ secrets.TFY_API_KEY }}
  APPLICATION_FQN: adopt-dev-cluster:adopt-dev-ws:dev-job-portal

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install "truefoundry<1.0.0"

      - name: Patch the commit sha
        run: |
          tfy patch-application --application-fqn ${{ env.APPLICATION_FQN }} --patch='{"image": {"build_source": {"ref": "${{ github.sha }}", "branch_name": "${{ github.ref_name }}"}}}'
